<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Krishnu Cotton Sarees</title>
<meta name="description" content="Krishnu Cotton Sarees customer ledger">
<meta name="theme-color" content="#0f4a2c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Krishnu">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: Krishnu Cotton Sarees ledger — handloom green header edged with a gold–magenta saree border; customer list pane + ledger pane side by side on wide screens, one pane at a time on phones */
:root{
  --bg:#f7f3e9; --surface:#ffffff; --surface-2:#fbf8f1; --ink:#14231b; --muted:#5f6b62; --line:#e6dfcf;
  --brand:#0f4a2c; --brand-ink:#ffffff; --brand-soft:rgba(255,255,255,.75);
  --primary:#0f5a34; --primary-ink:#ffffff; --tint:#e8f1e9;
  --zari:#c59a2e; --zari-soft:#f6ecd0; --rose:#b0124f;
  --due:#b0124f; --due-soft:#fbe7ee; --ok:#13734a; --ok-soft:#e4f3ea;
  --shadow:0 1px 2px rgba(20,40,25,.06),0 8px 24px rgba(20,40,25,.07);
  --brandfont:"Cinzel","Times New Roman",serif;
  --display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1510; --surface:#122019; --surface-2:#172820; --ink:#eef3ee; --muted:#9fb0a5; --line:#24382d;
  --brand:#0a2e1c; --brand-ink:#ffffff; --brand-soft:rgba(255,255,255,.72);
  --primary:#7fd3a3; --primary-ink:#06170e; --tint:#1a3326;
  --zari:#e2bb55; --zari-soft:#352c12; --rose:#f06c9b;
  --due:#ff8fb3; --due-soft:#3a1424; --ok:#5fd39a; --ok-soft:#12301f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1510; --surface:#122019; --surface-2:#172820; --ink:#eef3ee; --muted:#9fb0a5; --line:#24382d;
  --brand:#0a2e1c; --brand-ink:#ffffff; --brand-soft:rgba(255,255,255,.72);
  --primary:#7fd3a3; --primary-ink:#06170e; --tint:#1a3326;
  --zari:#e2bb55; --zari-soft:#352c12; --rose:#f06c9b;
  --due:#ff8fb3; --due-soft:#3a1424; --ok:#5fd39a; --ok-soft:#12301f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--zari);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
svg{display:block}

/* zari border — the woven gold edge of a silk saree */
.zari{height:10px;background:
  linear-gradient(to bottom,var(--zari) 0 2px,transparent 2px 8px,var(--zari) 8px),
  radial-gradient(circle at 5px 5px,var(--zari) 0 1.6px,transparent 2px) 0 0/10px 10px,
  var(--rose)}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--brand);color:var(--brand-ink)}
.top .in{display:flex;align-items:center;gap:8px;min-height:60px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mark{width:40px;height:40px;border-radius:50%;flex:none;border:2px solid var(--zari);object-fit:cover;background:#f8f4e7}
.brandname{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}
.brandname b{font-family:var(--brandfont);font-weight:700;font-size:18px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brandname small{color:var(--brand-soft);font-size:12px}
.tbtn{border:0;background:transparent;color:var(--brand-ink);height:40px;padding:0 12px;border-radius:10px;display:inline-flex;align-items:center;gap:8px;font-weight:600}
.tbtn:hover{background:rgba(255,255,255,.1)}
.tbtn svg{width:20px;height:20px}
@media (max-width:520px){.tbtn span{display:none}.tbtn{padding:0 10px}}

/* ---------- shell ---------- */
.cols{display:grid;grid-template-columns:minmax(0,1fr);max-width:1240px;margin:0 auto}
.pane{min-width:0;padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.shell[data-view="home"] .detail{display:none}
.shell:not([data-view="home"]) .list{display:none}
@media (min-width:920px){
  .cols{grid-template-columns:380px minmax(0,1fr)}
  .shell .list,.shell .detail{display:block!important}
  .list{border-right:1px solid var(--line);min-height:calc(100vh - 68px);padding-bottom:40px}
  .detail{padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px));padding-bottom:40px}
  .only-mobile{display:none!important}
}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.15}
.stat.hero{grid-column:1/-1;background:var(--brand);border-color:transparent;color:var(--brand-ink);padding:16px;position:relative;overflow:hidden}
.stat.hero .eyebrow{color:var(--brand-soft)}
.stat.hero b{font-size:32px}
.stat.hero::after{content:"";position:absolute;right:0;top:0;bottom:0;width:10px;background:linear-gradient(to right,var(--zari) 0 2px,var(--rose) 2px 8px,var(--zari) 8px)}

/* ---------- list ---------- */
.tools{display:flex;gap:8px;margin-top:16px}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{border:0;background:transparent;padding:11px 0;width:100%;min-width:0;outline:none}
.sel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 10px;max-width:42%}
.listhead{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 8px}
.clist{display:flex;flex-direction:column;gap:8px}
.crow{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;width:100%;transition:border-color .15s,background .15s}
.crow:hover{border-color:color-mix(in srgb,var(--primary) 40%,var(--line))}
.crow[aria-current="true"]{border-color:var(--primary);background:var(--tint)}
.av{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;font-family:var(--display);font-weight:800;font-size:16px;background:var(--tint);color:var(--primary);border:1.5px solid color-mix(in srgb,var(--zari) 55%,transparent)}
.crow .nm{flex:1;min-width:0}
.crow .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .nm small{color:var(--muted);font-size:12.5px}
.crow .amt{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.crow .amt b{font-weight:700}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px}
.pill.due{background:var(--due-soft);color:var(--due)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.empty{padding:32px 20px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:14px}
.empty b{color:var(--ink)}

/* ---------- buttons ---------- */
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--primary);color:var(--primary-ink)}
.btn.zari{background:var(--zari);color:#1e1406}
.btn.ok{background:var(--ok);color:#fff}
.btn.ghost{background:var(--tint);color:var(--ink)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:transparent;color:var(--due);border:1px solid color-mix(in srgb,var(--due) 50%,transparent)}
.btn.block{width:100%}
.btn.dangerfill{background:var(--due);color:#fff}
.icon.trash{color:var(--due)}
.icon.trash:hover{background:var(--due-soft);border-color:color-mix(in srgb,var(--due) 40%,var(--line))}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon{border:1px solid var(--line);background:var(--surface);width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none}
.icon svg{width:19px;height:19px}

/* ---------- customer detail ---------- */
.dhead{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.dhead h2{font-size:26px;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dhead .sub{color:var(--muted);font-size:13px}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.hero .top-band{background:var(--brand);color:var(--brand-ink);padding:18px 20px;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.hero .top-band .eyebrow{color:var(--brand-soft)}
.hero .bal{font-family:var(--display);font-weight:800;font-size:40px;line-height:1}
.hero .acts{display:flex;gap:8px;flex-wrap:wrap}
.hero .acts .btn{min-height:46px;padding:12px 18px}
@media (max-width:919px){.hero .acts{display:none}}
.hero .mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));}
.hero .mini div{padding:12px 20px;display:flex;flex-direction:column;border-right:1px solid var(--line)}
.hero .mini div:last-child{border-right:0}
.hero .mini b{font-family:var(--display);font-weight:800;font-size:19px}
@media (max-width:520px){.hero .mini div{padding:12px 14px}.hero .mini b{font-size:16px}.hero .bal{font-size:34px}}

.ledger{margin-top:20px;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.lrow{display:grid;grid-template-columns:92px minmax(0,1fr) 110px 120px 120px;gap:12px;align-items:center;padding:12px 18px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;width:100%}
.lhead{border-top:0;background:var(--surface-2)}
.lhead span{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.lrow .r{text-align:right}
button.lrow:hover{background:var(--surface-2)}
.lrow .desc{display:flex;flex-direction:column;min-width:0}
.lrow .desc b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .desc small{color:var(--muted);font-size:12.5px}
.lrow .d{font-size:13.5px}
.lrow .d small{display:block;color:var(--muted);font-size:12px}
.size{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;background:var(--zari-soft);color:var(--zari);margin-right:6px;vertical-align:1px}
.lrow.pay{background:color-mix(in srgb,var(--ok) 6%,transparent)}
.lrow.pay .amt{color:var(--ok)}
.lrow .amt{font-weight:700}
.lrow .bal{color:var(--muted)}
.lrow.opening .desc b{color:var(--muted)}
.month{padding:8px 18px;background:var(--surface-2);border-top:1px solid var(--line);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--zari)}
.lfoot{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-top:2px solid var(--line)}
.lfoot b{font-family:var(--display);font-weight:800;font-size:22px}
@media (max-width:700px){
  .lhead{display:none}
  .lrow{grid-template-columns:52px minmax(0,1fr) auto;grid-template-areas:"d desc amt" "d qr bal";row-gap:0;padding:12px 14px}
  .lrow .d{grid-area:d;align-self:start}
  .lrow .desc{grid-area:desc}
  .lrow .qr{grid-area:qr;color:var(--muted);font-size:12.5px}
  .lrow .amt{grid-area:amt}
  .lrow .bal{grid-area:bal;font-size:12px}
  .lrow .d b{display:block;font-family:var(--display);font-weight:800;font-size:20px;line-height:1}
  .month{padding:8px 14px}
  .lfoot{padding:14px}
}
@media (min-width:701px){.lrow .d b{font-weight:600}.lrow .d b::after{content:" "}.lrow .d small{display:inline;font-size:13.5px;color:inherit}}

.mbar{position:fixed;left:0;right:0;bottom:0;z-index:7;display:flex;gap:10px;padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-top:1px solid var(--line)}
.mbar .btn{flex:1}

.welcome{height:100%;min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;color:var(--muted);border:1.5px dashed var(--line);border-radius:18px;padding:40px 24px}
.welcome .wlogo{width:min(220px,60%);height:auto;border-radius:50%;}
.welcome h2{color:var(--ink);font-size:22px}

/* ---------- sheets ---------- */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(20,8,20,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:94vh;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;display:flex;flex-direction:column}
@media (min-width:700px){.scrim{align-items:center;padding:24px}.sheet{border-radius:22px;max-height:88vh;box-shadow:0 30px 80px rgba(0,0,0,.35)}}
.sheet .sh{position:sticky;top:0;z-index:1;background:var(--surface);display:flex;align-items:center;gap:12px;padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.sheet .sh h2{flex:1;font-size:21px;font-weight:800}
.sheet .sb{padding:18px 20px;display:flex;flex-direction:column;gap:18px}
.sheet .sf{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-top:14px;padding-left:20px;padding-right:20px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center}
.sheet .sf .tot{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.sheet .sf .tot b{font-family:var(--display);font-weight:800;font-size:24px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl{font-size:13px;font-weight:600}
.inp{padding:11px 13px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);width:100%;min-width:0}
.inp:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:inline-flex;background:var(--tint);padding:4px;border-radius:12px;gap:4px}
.seg button{white-space:nowrap;border:0;background:transparent;padding:8px 16px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{position:relative;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:62px}
.tile b{font-weight:600;font-size:14px;line-height:1.25}
.tile span{color:var(--muted);font-size:13px}
.tile:hover{border-color:var(--primary)}
.tile.on{border-color:var(--primary);background:var(--tint)}
.tile .cnt{position:absolute;top:-7px;right:-7px;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--zari);color:#1e1406;font-size:12px;font-weight:700;display:grid;place-items:center}
.lines{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sline{display:grid;grid-template-columns:minmax(0,1fr) auto auto 32px;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.sline:first-child{border-top:0}
.sline .nm{min-width:0}
.sline .nm b{display:block;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sline .nm .inp{padding:7px 9px}
.sline .rate{width:88px;padding:7px 9px}
.sline .lt{display:block;color:var(--muted);font-size:12.5px}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.step button{border:0;background:transparent;width:32px;height:34px;font-size:18px;line-height:1}
.step input{width:34px;border:0;background:transparent;text-align:center;padding:0}
.x{border:0;background:transparent;color:var(--muted);width:32px;height:32px;border-radius:8px;font-size:16px}
.x:hover{background:var(--due-soft);color:var(--due)}
@media (max-width:480px){.sline{grid-template-columns:minmax(0,1fr) auto 28px;grid-template-areas:"nm nm x" "st rt rt"}.sline .nm{grid-area:nm}.sline .step{grid-area:st;justify-self:start}.sline .rwrap{grid-area:rt;justify-self:end}.sline .x{grid-area:x}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.linkbtn{border:0;background:transparent;color:var(--primary);font-weight:600;padding:0;align-self:flex-start}
.confirm{padding:12px 14px;border-radius:12px;background:var(--due-soft);color:var(--due);display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:500}
.note{font-size:13px;color:var(--muted)}

/* ---------- admin ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px}
.card + .card{margin-top:16px}
.card h3{font-size:18px;font-weight:800}
.cat{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.crow2{display:grid;grid-template-columns:minmax(0,1fr) 96px 110px 36px;gap:8px;align-items:center;padding:8px 10px;border-top:1px solid var(--line)}
.crow2:first-child{border-top:0}
.crow2.h{background:var(--surface-2)}
.crow2 .inp{padding:8px 10px}
.crow2 .pre{position:relative}
.crow2 .pre span{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.crow2 .pre .inp{padding-left:22px}
@media (max-width:440px){.crow2{grid-template-columns:minmax(0,1fr) 78px 86px 30px;gap:6px;padding:8px}}
.savebar{position:sticky;bottom:0;margin-top:16px;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;gap:10px;justify-content:flex-end}

/* ---------- lock ---------- */
.lock{min-height:100%;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:
  radial-gradient(1200px 500px at 50% -10%,color-mix(in srgb,var(--zari) 22%,transparent),transparent 60%),var(--brand)}
.lockcard{width:min(400px,100%);background:var(--surface);border-radius:22px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.lockcard .lb{padding:28px 26px 26px;display:flex;flex-direction:column;gap:14px}
.lockcard .lm{width:200px;max-width:70%;height:auto;align-self:center;margin:-8px 0 -4px;border-radius:18px}
.lockcard h1{font-family:var(--brandfont);text-align:center;letter-spacing:.03em}
.lockcard .lsub{text-align:center}

/* paid progress bar in customer list */
.pbar{display:block;height:4px;border-radius:2px;background:var(--tint);margin-top:7px;overflow:hidden;max-width:180px}

/* saree tiles coloured by length */
.tile{border-left-width:4px}

.tile.s550.on{background:color-mix(in srgb,#d6336c 10%,var(--surface));border-color:#d6336c}
.seg button[aria-pressed="true"]{background:var(--g-brand);color:#fff}
.btn.sale{background:var(--g-rose);color:#fff}
.btn.ok{background:var(--g-leaf)}
.btn.primary{background:var(--g-brand);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{background:var(--primary);color:var(--primary-ink)}}
:root[data-theme="dark"] .btn.primary{background:var(--primary);color:var(--primary-ink)}
.lrow.pay .desc b::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:7px;vertical-align:1px}

/* skeleton */
.skel{height:66px;border-radius:14px;margin-bottom:8px;background:linear-gradient(90deg,var(--surface) 0%,var(--tint) 50%,var(--surface) 100%);background-size:200% 100%;border:1px solid var(--line)}

/* toast */
.toast{display:flex;gap:10px;align-items:center;border-radius:14px;transition:opacity .3s,transform .3s}

.bnav{position:fixed;left:0;right:0;bottom:0;z-index:9;display:grid;grid-template-columns:repeat(4,1fr);background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);box-shadow:0 -6px 20px rgba(0,0,0,.05)}
.bnav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 2px 9px;color:var(--muted);font-size:11.5px;font-weight:600;position:relative}

@media (max-width:919px){

/* ---------- motion ---------- */
.btn,.crow,.tile,.chip,.icon,.fab,.bnav button,.lrow,.tbtn{transition:transform .14s var(--ease),background-color .2s,border-color .2s,box-shadow .2s}
.btn:active,.crow:active,.tile:active,.chip:active,.icon:active,.fab:active,.lrow:active{transform:scale(.97)}
@media (prefers-reduced-motion: no-preference){

  @keyframes grow{from{transform:scaleY(0)}}
  @keyframes widen{from{width:0}}
  @keyframes pulse{0%{transform:scale(1)}35%{transform:scale(1.09)}100%{transform:scale(1)}}

  .anim .stat:nth-child(2),.anim .kpi:nth-child(2){animation-delay:.06s}

  .anim .tools{animation-delay:.14s}.anim .listhead{animation-delay:.18s}
  .anim .hero{animation-delay:.05s}.anim .ledger{animation-delay:.14s}
  .anim .crow{animation:rise-in .45s var(--ease) both;animation-delay:calc(var(--i,0) * 45ms + 200ms)}
  .anim .rcard,.anim .scard{animation-delay:.12s}
  .anim .chart rect{transform-box:fill-box;transform-origin:50% 100%;animation:grow .8s var(--ease) both}
  .anim .chart rect:nth-of-type(n+8){animation-delay:.15s}

  .scrim{animation:fadein .2s ease-out}

}

/* ---------- ledger math ---------- */
const sortE=l=>[...l].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.seq||0)-(b.seq||0));
function ledger(c,entries){
  let bal=Number(c.opening||0),bought=0,paid=0,pcs=0,lastPay=null;const rows=[];
  for(const e of sortE(entries)){
    if(e.kind==="pay"){bal-=Number(e.amount)||0;paid+=Number(e.amount)||0;lastPay=e.date}
    else{bal+=Number(e.amount)||0;bought+=Number(e.amount)||0;pcs+=Number(e.qty)||0}
    rows.push({...e,bal});
  }
  return{rows,bal,bought,paid,pcs,lastPay};
}
const profitOf=e=>e.kind==="sale"&&num(e.cost)!=null?(Number(e.rate)-Number(e.cost))*(Number(e.qty)||0):null;

}

/* ---------- reports ---------- */
function inPeriod(s){
  const n=new Date(),y=n.getFullYear(),m=n.getMonth()+1,p=dParts(s);
  switch(S.period){
    case "month":return p.y===y&&p.m===m;
    case "last":{let ly=y,lm=m-1;if(!lm){lm=12;ly--}return p.y===ly&&p.m===lm}
    case "3m":return s>=iso(new Date(y,m-3,1));
    case "year":return p.y===y;
    default:return true;
  }
}

  const topC=Object.values(tc).sort((a,b)=>b.amt-a.amt).slice(0,8);const maxA=Math.max(1,...topC.map(t=>t.amt));
  const per=PER.find(p=>p[0]===S.period)[1];
  return `

  </div>`;

function monthChart(){
  const last=S.entries.reduce((m,e)=>e.date>m?e.date:m,"");
  const end=last?dParts(last):{y:new Date().getFullYear(),m:new Date().getMonth()+1};
  const N=innerWidth<600?6:12;const months=[];for(let i=N-1;i>=0;i--){let y=end.y,m=end.m-i;while(m<1){m+=12;y--}months.push({y,m,s:0,r:0,p:0})}
  for(const e of S.entries){const p=dParts(e.date);const b=months.find(x=>x.y===p.y&&x.m===p.m);if(!b)continue;if(e.kind==="pay")b.r+=Number(e.amount)||0;else{b.s+=Number(e.amount)||0;const pr=profitOf(e);if(pr!=null)b.p+=pr}}
  const W=N===6?400:760,H=N===6?230:260,L=N===6?46:58,R=8,T=14,B=30,cw=W-L-R,ch=H-T-B;
  const mx=Math.max(1,...months.map(x=>Math.max(x.s,x.r,x.p)));
  const pw=Math.pow(10,Math.floor(Math.log10(mx)));const nice=[1,2,2.5,5,10].map(k=>k*pw).find(v=>v>=mx);
  const y=v=>T+ch-(v/nice)*ch;const gw=cw/N,bw=Math.min(18,gw*0.32);
  let g="";for(let i=0;i<=4;i++){const v=nice*i/4;g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${L-8}" y="${y(v)+4}" text-anchor="end">${rsShort(v)}</text>`}
  let bars="",pts=[];
  months.forEach((x,i)=>{const cx=L+gw*i+gw/2;
    bars+=`<rect class="s" x="${cx-bw-1}" y="${y(x.s)}" width="${bw}" height="${Math.max(0,T+ch-y(x.s))}" rx="3"><title>${MON[x.m-1]} ${x.y} sales ${rs(x.s)}</title></rect>`;
    bars+=`<rect class="r" x="${cx+1}" y="${y(x.r)}" width="${bw}" height="${Math.max(0,T+ch-y(x.r))}" rx="3"><title>${MON[x.m-1]} ${x.y} received ${rs(x.r)}</title></rect>`;
    bars+=`<text class="axis" x="${cx}" y="${H-10}" text-anchor="middle">${MON[x.m-1]}${x.m===1||i===0?" "+String(x.y).slice(2):""}</text>`;
    pts.push([cx,y(Math.max(0,x.p))]);});
  const line=`<polyline class="p" points="${pts.map(p=>p.join(",")).join(" ")}"/>`+pts.map((p,i)=>`<circle class="pd" cx="${p[0]}" cy="${p[1]}" r="3"><title>${MON[months[i].m-1]} profit ${rs(months[i].p)}</title></circle>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly sales, received and profit">${g}${bars}${line}</svg>`;
}

function updSale(){$("#f-total").textContent=rs(saleTotal());$("#f-pcs").textContent=saleCount()+(saleCount()===1?" saree":" sarees");F.lines.forEach((l,i)=>{const s=document.querySelector(`.l-sum[data-i="${i}"]`);if(s)s.textContent=rs((Number(l.qty)||0)*(Number(l.rate)||0))})}
function paySheet(e){
  F=e?{kind:"pay",edit:e.id,seq:e.seq,date:e.date,amount:e.amount,note:e.note||"Cash"}:{kind:"pay",date:today(),amount:"",note:"Cash"};
  const c=cust();const cur=ledger(c,custEntries(c.id).filter(x=>x.id!==F.edit)).bal;
  const M=["Cash","UPI","Bank transfer","Cheque"];
  sheet(F.edit?"Edit payment":"Payment from "+c.name,`
    <div class="grid2"><div class="field"><label for="f-date">Date</label><input id="f-date" class="inp" type="date" value="${esc(F.date)}"></div>
    <div class="field"><label for="f-amt">Amount received ₹</label><input id="f-amt" class="inp num" inputmode="numeric" value="${esc(F.amount)}" placeholder="e.g. 5000"></div></div>
    <div class="field"><span class="lbl">Paid by</span><div class="chips">${M.map(m=>`<button class="chip" data-act="method" data-v="${m}" aria-pressed="${String(F.note).startsWith(m)}">${m}</button>`).join("")}</div></div>
    <div class="field"><label for="f-note">Note <span class="muted">(optional)</span></label><input id="f-note" class="inp" value="${esc(String(F.note).includes(" · ")?F.note.split(" · ").slice(1).join(" · "):M.includes(F.note)?"":F.note)}" placeholder="e.g. GPay ref 4821"></div>
    ${F.edit?`<div id="delzone"><button class="btn danger block" data-act="askdel">Delete this payment</button></div>`:""}`,
    `<div class="tot"><span class="muted">Balance after payment</span><b class="num" id="f-after" data-cur="${cur}">${rs(cur-(Number(F.amount)||0))}</b></div><button class="btn ok" data-act="savepay">${F.edit?"Save":"Save payment"}</button>`);
  F.method=M.find(m=>String(F.note).startsWith(m))||"Cash";
  $("#f-date").addEventListener("change",ev=>F.date=ev.target.value);
  $("#f-amt").addEventListener("input",ev=>{F.amount=ev.target.value.replace(/[^0-9.]/g,"");const a=$("#f-after");a.textContent=rs(Number(a.dataset.cur)-(Number(F.amount)||0))});
  if(!F.edit)$("#f-amt").focus();
}
document.addEventListener("input",ev=>{
  const t=ev.target;if(!F||F.kind!=="sale"||t.dataset.i==null)return;const l=F.lines[Number(t.dataset.i)];if(!l)return;
  if(t.classList.contains("l-qty"))l.qty=t.value.replace(/[^0-9]/g,"");
  else if(t.classList.contains("l-rate"))l.rate=t.value.replace(/[^0-9.]/g,"");
  else if(t.classList.contains("l-name"))l.name=t.value;
  updSale();
});

/* ---------- writes ---------- */
async function syncCustomer(cid,entries){
  const c=S.customers.find(x=>x.id===cid);if(!c)return;
  const L=ledger(c,entries);const last=entries.length?sortE(entries).at(-1).date:null;
  const up={balance:L.bal,bought:L.bought,paid:L.paid,pcs:L.pcs,lastDate:last,lastPayDate:L.lastPay};
  if(Object.keys(up).some(k=>c[k]!==up[k]))await S.db.doc("customers/"+cid).update(up);
}
const newId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
async function saveSale(){
  const c=cust();if(!F.date){toast("Pick a date.");return}
  const lines=F.lines.filter(l=>(Number(l.qty)||0)>0);
  if(!lines.length){toast("Add at least one saree.");return}
  if(lines.some(l=>!String(l.name).trim())){toast("Give every saree a name.");return}
  if(lines.some(l=>!(Number(l.rate)>0))){toast("Every saree needs a price.");return}
  const old=F.edit?S.entries.find(x=>x.id===F.edit):null;
  const writes=lines.map((l,i)=>{const name=String(l.name).trim();const it=catalog()[findItem(name,l.size)];
    const cost=old&&old.design===name&&old.size===l.size&&num(old.cost)!=null?old.cost:(it&&num(it.cost)!=null?Number(it.cost):null);
    return{id:F.edit||newId("e"),body:{kind:"sale",customerId:c.id,date:F.date,size:l.size,design:name,qty:Number(l.qty),rate:Number(l.rate),amount:Number(l.qty)*Number(l.rate),cost,seq:F.edit?(F.seq||Date.now()):Date.now()+i}}});
  const changes=[];if(old)changes.push({name:old.design,size:old.size,delta:Number(old.qty)||0});
  writes.forEach(w=>changes.push({name:w.body.design,size:w.body.size,delta:-w.body.qty}));
  const n=saleCount(),tot=saleTotal(),edit=!!F.edit;closeSheet();
  try{
    for(const w of writes)await S.db.doc("entries/"+w.id).set(w.body);
    const ids=new Set(writes.map(w=>w.id));
    await syncCustomer(c.id,custEntries(c.id).filter(x=>!ids.has(x.id)).concat(writes.map(w=>({id:w.id,...w.body}))));
    const cat=applyStock(changes);if(cat)await S.db.doc("settings/main").update({designs:cat});
    const lowNow=cat?cat.filter(d=>num(d.stock)!=null&&d.stock<=LOW&&writes.some(w=>w.body.design===d.name&&w.body.size===d.size)):[];
    toast(edit?"Sale updated":`Sale saved · ${n} saree${n===1?"":"s"} · ${rs(tot)}`+(lowNow.length?` · Low stock: ${lowNow.map(d=>d.name).join(", ")}`:""));
  }catch(e){fail(e)}
}
async function savePay(){
  const c=cust();const amt=Number(F.amount);
  if(!F.date){toast("Pick a date.");return}
  if(!(amt>0)){toast("Enter the amount received.");return}
  const extra=($("#f-note").value||"").trim();
  const body={kind:"pay",customerId:c.id,date:F.date,amount:amt,note:F.method+(extra?" · "+extra:""),seq:F.seq||Date.now()};
  const id=F.edit||newId("e");const edit=!!F.edit;closeSheet();
  try{await S.db.doc("entries/"+id).set(body);await syncCustomer(c.id,custEntries(c.id).filter(x=>x.id!==id).concat([{id,...body}]));toast(edit?"Payment updated":`Payment of ${rs(amt)} saved`)}catch(e){fail(e)}
}
async function delEntry(){
  const c=cust();const id=F.edit;const old=S.entries.find(x=>x.id===id);closeSheet();
  try{
    await S.db.doc("entries/"+id).delete();await syncCustomer(c.id,custEntries(c.id).filter(x=>x.id!==id));
    if(old&&old.kind==="sale"){const cat=applyStock([{name:old.design,size:old.size,delta:Number(old.qty)||0}]);if(cat)await S.db.doc("settings/main").update({designs:cat})}
    toast("Entry deleted");
  }catch(e){fail(e)}
}
async function saveCust(id){
  const name=$("#c-name").value.trim();if(!name){toast("Enter the customer's name.");$("#c-name").focus();return}
  const opening=Number(($("#c-open").value||"0").replace(/[^0-9.]/g,""))||0;
  const body={name,phone:$("#c-phone").value.trim(),opening,openingDate:$("#c-odate").value||today()};
  closeSheet();
  try{
    if(id){const c=S.customers.find(x=>x.id===id);const L=ledger({...c,...body},custEntries(id));await S.db.doc("customers/"+id).update({...body,balance:L.bal});toast("Customer updated")}
    else{const nid=newId("c");await S.db.doc("customers/"+nid).set({...body,balance:opening,bought:0,paid:0,pcs:0,lastDate:null,lastPayDate:null,createdAt:Date.now()});toast(name+" added");openCustomer(nid)}
  }catch(e){fail(e)}
}
async function delCust(){
  const id=S.custId;const nm=cust().name;closeSheet();
  try{
    for(const e of custEntries(id))await S.db.doc("entries/"+e.id).delete();
    await S.db.doc("customers/"+id).delete();
    S.custId=null;S.view="home";render();toast(nm+" deleted");
  }catch(e){fail(e)}
}
async function saveAdmin(){
  const designs=$$("#cat .crow2.c").map(r=>{const name=r.querySelector(".c-name").value.trim(),size=r.querySelector(".c-size").value;
    return{name,size,rate:Number(r.querySelector(".c-rate").value.replace(/[^0-9.]/g,""))||0,cost:num(r.querySelector(".c-cost").value.replace(/[^0-9.]/g,"")),stock:num(r.dataset.stock)}}).filter(d=>d.name);
  if(designs.some(d=>!(d.rate>0))){toast("Every saree needs a selling price.");return}
  const pw=$("#a-pw").value,pw2=$("#a-pw2").value;
  if(pw||pw2){if(pw.length<6){toast("Password needs at least 6 characters.");return}if(pw!==pw2){toast("The two passwords don't match.");return}}
  const body={...(S.settings||{}),shop:$("#a-shop").value.trim(),designs};
  delete body.passHash;delete body.pin;
  try{await S.db.doc("settings/main").set(body)}catch(e){fail(e);return}
  if(pw){try{await S.auth.currentUser.updatePassword(pw);toast("Saved. Use your new password next time.",true)}
    catch(e){toast(e.code==="auth/requires-recent-login"?"Prices saved. To change the password, lock the app, sign in again, then try.":e.code==="auth/weak-password"?"Prices saved. Password too weak; use at least 6 characters.":"Prices saved, but the password didn't change. Try again.",false)}}
  else toast("Changes saved",true);
  S.view=S.custId?"cust":"home";render();
}

/* ---------- backup & restore ---------- */
let xlsxP=null;
function loadXLSX(){if(window.XLSX)return Promise.resolve();return xlsxP=xlsxP||new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=res;s.onerror=()=>{xlsxP=null;rej(new Error("load"))};document.head.appendChild(s)})}
function saveFile(name,data,type){const blob=data instanceof Blob?data:new Blob([data],{type});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
async function backup(btn){
  if(btn)btn.disabled=true;
  try{
    await loadXLSX();
    const X=window.XLSX,wb=X.utils.book_new();
    const cs=[...S.customers].sort((a,b)=>a.name.localeCompare(b.name)).map(c=>({"Customer":c.name,"Phone":c.phone||"","Old balance":Number(c.opening)||0,"Old balance date":c.openingDate||"","Sarees bought":Number(c.pcs)||0,"Sales":Number(c.bought)||0,"Paid":Number(c.paid)||0,"Balance due":Number(c.balance)||0,"Last entry":c.lastDate||"","Last payment":c.lastPayDate||""}));
    const es=sortE(S.entries).map(e=>({"Date":e.date,"Customer":custName(e.customerId),"Type":e.kind==="pay"?"Payment":"Sale","Saree":e.design||"","Size (m)":e.size||"","Qty":e.kind==="sale"?Number(e.qty):"","Rate":e.kind==="sale"?Number(e.rate):"","Sale amount":e.kind==="sale"?Number(e.amount):"","Payment":e.kind==="pay"?Number(e.amount):"","Buy price":num(e.cost)??"","Profit":profitOf(e)??"","Note":e.note||""}));
    const ps=catalog().map(d=>({"Saree":d.name,"Size (m)":d.size,"Buy price":num(d.cost)??"","Sell price":d.rate,"In stock":num(d.stock)??""}));
    const add=(rows,name,w)=>{const ws=X.utils.json_to_sheet(rows.length?rows:[{}]);ws["!cols"]=w.map(x=>({wch:x}));X.utils.book_append_sheet(wb,ws,name)};
    add(cs,"Customers",[24,14,12,14,12,12,12,12,12,12]);add(es,"Ledger",[11,24,9,20,8,6,8,11,10,9,9,22]);add(ps,"Price list",[20,8,10,10,9]);
    const buf=X.write(wb,{bookType:"xlsx",type:"array"});
    saveFile(`krishnu-ledger-${today()}.xlsx`,new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
    toast("Excel backup downloaded",true);
  }catch(e){console.error(e);toast(e&&e.message==="load"?"Couldn't load the Excel tool. Check your internet and try again.":"Couldn't create the backup. Try again.",false)}
  finally{if(btn)btn.disabled=false}
}
function jsonBackup(){
  const main={...(S.settings||{})};delete main.passHash;delete main.pin;
  const data={app:"krishnu-ledger",version:1,exportedAt:new Date().toISOString(),settings:{main},
    customers:Object.fromEntries(S.customers.map(({id,...r})=>[id,r])),entries:Object.fromEntries(S.entries.map(({id,...r})=>[id,r]))};
  saveFile(`krishnu-backup-${today()}.json`,JSON.stringify(data,null,1),"application/json");toast("Full backup downloaded",true);
}
let pendingRestore=null;
async function restorePrompt(file){
  try{
    const R=JSON.parse(await file.text());
    if(!R||typeof R!=="object"||(!R.customers&&!R.entries))throw new Error("shape");
    pendingRestore=R;const nc=Object.keys(R.customers||{}).length,ne=Object.keys(R.entries||{}).length;
    sheet("Restore backup",`<p style="margin:0">This file has <b>${nc} customers</b> and <b>${ne} sales and payments</b>${R.settings&&R.settings.main?" plus your saree price list":""}.</p>
      <div class="confirm" style="display:block">Records in the file replace records with the same ID in the app. Nothing else is deleted.</div>`,
      `<span style="flex:1"></span><button class="btn line" data-act="close">Cancel</button><button class="btn primary" data-act="dorestore">Restore</button>`);
  }catch(e){toast("That file isn't a Krishnu backup. Pick the .json file from Full backup.",false)}
}
async function doRestore(){
  const R=pendingRestore;pendingRestore=null;closeSheet();if(!R)return;
  const ops=[];
  if(R.settings&&R.settings.main){const m={...R.settings.main};delete m.passHash;delete m.pin;ops.push(["settings/main",m])}
  for(const[id,b]of Object.entries(R.customers||{}))ops.push(["customers/"+id,b]);
  for(const[id,b]of Object.entries(R.entries||{}))ops.push(["entries/"+id,b]);
  try{
    for(let i=0;i<ops.length;i+=400){const batch=S.db.batch();ops.slice(i,i+400).forEach(([p,b])=>batch.set(S.db.doc(p),b));await batch.commit()}
    toast(`Restored ${Object.keys(R.customers||{}).length} customers and ${Object.keys(R.entries||{}).length} entries`,true);
  }catch(e){fail(e)}
}
document.addEventListener("change",ev=>{if(ev.target.id==="restorefile"&&ev.target.files&&ev.target.files[0]){restorePrompt(ev.target.files[0]);ev.target.value=""}});

/* ---------- navigation ---------- */
function openCustomer(id){S.custId=id;S.view="cust";render();window.scrollTo(0,0)}
function statement(){
  const c=cust();const L=ledger(c,custEntries(c.id));
  const out=[`*${shopName()}*`,`Statement for ${c.name}`,""];
  if(c.opening)out.push(`${dFull(c.openingDate)} — Opening balance: ${rs(c.opening)}`);
  for(const e of L.rows)out.push(e.kind==="pay"?`${dFull(e.date)} — Payment received: −${rs(e.amount)}`:`${dFull(e.date)} — ${e.design} (${e.size}m) ${e.qty} × ${rs(e.rate)} = ${rs(e.amount)}`);
  out.push("",`Total sales: ${rs(L.bought)}`,`Total paid: ${rs(L.paid)}`,`*Balance due: ${rs(L.bal)}*`);
  return out.join("\n");
}
async function copyText(t,okMsg){
  try{await navigator.clipboard.writeText(t);toast(okMsg)}
  catch(e){sheet("Copy this",`<textarea id="stmt" class="inp" style="min-height:40vh">${esc(t)}</textarea><p class="note" style="margin:0">Select all and copy, then paste in WhatsApp.</p>`,`<span style="flex:1"></span><button class="btn line" data-act="close">Close</button>`);const ta=$("#stmt");ta.focus();ta.select()}
}

/* ---------- clicks ---------- */
document.addEventListener("click",async ev=>{
  const b=ev.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
  switch(a){
    case "scrim":if(ev.target===b)closeSheet();return;
    case "close":closeSheet();return;
    case "showpw":{const i=$("#pw");const show=i.type==="password";["#pw","#pw2"].forEach(s=>{const x=$(s);if(x)x.type=show?"text":"password"});b.textContent=show?"Hide":"Show";return}
    case "lock":closeSheet();if(S.auth)S.auth.signOut();return;
    case "forgot":{const em=($("#em")||{}).value?.trim();if(!em){$("#pwerr").textContent="Type your email first, then tap Forgot password.";return}try{await S.auth.sendPasswordResetEmail(em);$("#pwerr").textContent="";toast("Password reset email sent to "+em,true)}catch(e){$("#pwerr").textContent=AUTHMSG[e.code]||"Couldn't send the email. Try again."}return}
    case "jsonbackup":jsonBackup();return;
    case "dorestore":doRestore();return;
    case "tab":{const v=b.dataset.v;S.view=v==="customers"?(S.custId&&cust()?"cust":"home"):v;render();window.scrollTo(0,0);return}
    case "home":S.view="home";render();return;
    case "open":openCustomer(b.dataset.id);return;
    case "addcust":custSheet(null);return;
    case "editcust":custSheet(cust());return;
    case "savecust":saveCust(b.dataset.id);return;
    case "askdelcust":$("#delzone").innerHTML=`<div class="confirm"><span style="flex:1;min-width:16ch">Delete ${esc(cust().name)} and all their entries? This can't be undone.</span><button class="btn danger" style="background:var(--surface)" data-act="delcust">Delete</button></div>`;return;
    case "delcustask":{const c=cust();const n=custEntries(c.id).length;const b=Number(c.balance)||0;
      sheet("Delete customer?",`<div style="display:flex;gap:12px;align-items:center">${av(c.name)}<div><b>${esc(c.name)}</b><div class="muted" style="font-size:13.5px">${n} entries · balance ${rs(b)}</div></div></div>
        <div class="confirm" style="display:block">This permanently removes ${esc(c.name)} and all ${n} sales and payments.${b>0?` Their unpaid balance of <b>${rs(b)}</b> will also be gone.`:""} This can't be undone.</div>
        <p class="note" style="margin:0">Tip: take an Excel backup from Admin first if you might need these records later.</p>`,
        `<span style="flex:1"></span><button class="btn line" data-act="close">Cancel</button><button class="btn dangerfill" data-act="delcust">${I.trash}Delete</button>`);return}
    case "delcust":delCust();return;
    case "addsale":saleSheet(null);return;
    case "addpay":paySheet(null);return;
    case "edit":{const e=S.entries.find(x=>x.id===b.dataset.id);if(e)(e.kind==="pay"?paySheet:saleSheet)(e);return}
    case "fsize":F.size=b.dataset.v;drawSale();return;
    case "pick":{
      const n=b.dataset.n,r=Number(b.dataset.r);
      if(F.edit){F.lines[0]={...F.lines[0],name:n,rate:r,size:F.size,custom:false}}
      else{const l=F.lines.find(x=>x.name===n&&x.size===F.size&&!x.custom);if(l)l.qty=(Number(l.qty)||0)+1;else F.lines.push({name:n,size:F.size,rate:r,qty:1})}
      const sc=$(".sheet").scrollTop;drawSale();$(".sheet").scrollTop=sc;return}
    case "custom":{F.lines.push({name:"",size:F.size,rate:"",qty:1,custom:true});const sc=$(".sheet").scrollTop;drawSale();$(".sheet").scrollTop=sc;const ins=$$(".l-name");if(ins.length)ins.at(-1).focus();return}
    case "lq":{const l=F.lines[Number(b.dataset.i)];l.qty=Math.max(1,(Number(l.qty)||0)+Number(b.dataset.v));const inp=document.querySelector(`.l-qty[data-i="${b.dataset.i}"]`);if(inp)inp.value=l.qty;updSale();return}
    case "lx":{F.lines.splice(Number(b.dataset.i),1);const sc=$(".sheet").scrollTop;drawSale();$(".sheet").scrollTop=sc;return}
    case "savesale":saveSale();return;
    case "method":F.method=b.dataset.v;$$('[data-act="method"]').forEach(x=>x.setAttribute("aria-pressed",x.dataset.v===F.method));return;
    case "savepay":savePay();return;
    case "askdel":$("#delzone").innerHTML=`<div class="confirm"><span style="flex:1;min-width:16ch">Delete this entry? The balance${F&&F.kind==="sale"?" and stock":""} will be recalculated.</span><button class="btn danger" style="background:var(--surface)" data-act="delentry">Delete</button></div>`;return;
    case "delentry":delEntry();return;
    case "addcat":{const box=$("#cat");box.insertAdjacentHTML("beforeend",catRow({name:"",size:"6.20",rate:"",cost:"",stock:null},box.children.length));box.lastElementChild.querySelector(".c-name").focus();return}
    case "delcat":b.closest(".crow2").remove();return;
    case "saveadmin":saveAdmin();return;
    case "backup":backup(b);return;
    case "stockadd":stockSheet(Number(b.dataset.i),"add");return;
    case "stockset":stockSheet(Number(b.dataset.i),"set");return;
    case "stocksave":stockSave(Number(b.dataset.i),b.dataset.m);return;
    case "remcopy":{const c=S.customers.find(x=>x.id===b.dataset.id);if(c)copyText(reminderText(c),"Reminder copied. Paste it in WhatsApp.");return}
    case "copy":copyText(statement(),"Statement copied. Paste it in WhatsApp.");return;
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#layer .scrim"))closeSheet()});

/* ---------- boot (Firebase) ---------- */
let unsubs=[];
function stopData(){unsubs.forEach(u=>{try{u()}catch(_){}});unsubs=[];S.settings=null;S.settingsLoaded=false;S.customers=[];S.custLoaded=false;S.entries=[];S.entriesLoaded=false;S.custId=null;S.view="home";S.lastKey=null}
function loadErr(e){console.error(e);if(e&&e.code==="permission-denied"){S.denied=true;render()}else toast("Couldn't load data. Check your internet.",false)}
function startData(){
  stopData();S.denied=false;const db=S.db;
  unsubs.push(db.doc("settings/main").onSnapshot(s=>{S.settings=s.exists?s.data():null;const first=!S.settingsLoaded;S.settingsLoaded=true;if(first)render();else softRender()},loadErr));
  unsubs.push(db.collection("customers").onSnapshot(snap=>{S.customers=snap.docs.map(d=>({id:d.id,...d.data()}));S.custLoaded=true;if(S.settingsLoaded)softRender()},loadErr));
  unsubs.push(db.collection("entries").orderBy("date","desc").limit(1000).onSnapshot(snap=>{S.entries=snap.docs.map(d=>({id:d.id,...d.data()}));S.entriesLoaded=true;if(S.settingsLoaded)softRender()},loadErr));
}
(function boot(){
  const cfg=window.FIREBASE_CONFIG;
  if(!window.firebase||!cfg||!cfg.apiKey||/PASTE/i.test(cfg.apiKey)){S.offline="config";S.authReady=true;render();return}
  firebase.initializeApp(cfg);
  S.auth=firebase.auth();S.db=firebase.firestore();
  try{S.db.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(_){}
  S.auth.setPersistence(firebase.auth.Auth.Persistence.SESSION).catch(()=>{});
  S.auth.onAuthStateChanged(u=>{S.user=u;S.authReady=true;if(u){S.unlocked=true;startData();render()}else{stopData();S.unlocked=false;S.denied=false;render()}});
})();
})();
</script>
